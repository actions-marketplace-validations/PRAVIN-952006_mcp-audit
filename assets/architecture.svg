<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="mcp-audit three-engine architecture diagram">
  <rect x="0" y="0" width="900" height="330" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="450" y="34" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">mcp-audit — Zero-Dependency Security Pipeline</text>
  <text x="450" y="54" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">100% Offline · Pure Node.js Built-ins · 20 Rules · Live JSON-RPC 2.0 · SARIF 2.1.0</text>

  <!-- Column 1: Inputs -->
  <rect x="28" y="82" width="215" height="218" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="135" y="106" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">1. Discovery &amp; Probing</text>

  <rect x="44" y="122" width="183" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="135" y="142" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">Local MCP Configs</text>
  <text x="135" y="159" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">Claude · Cursor · VS Code · Windsurf</text>

  <rect x="44" y="180" width="183" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="135" y="200" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">Live JSON-RPC 2.0 Probe</text>
  <text x="135" y="217" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">stdio + Streamable-HTTP / SSE</text>

  <rect x="44" y="238" width="183" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="135" y="258" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">mcp-audit.lock.json</text>
  <text x="135" y="275" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">Canonical SHA-256 baseline</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="243" y1="190" x2="282" y2="190" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="282,185 292,190 282,195" fill="#58a6ff"/>

  <!-- Column 2: 3 Detection Engines -->
  <rect x="294" y="82" width="312" height="218" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
  <text x="450" y="106" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">2. Three Analysis Engines (20 Rules)</text>

  <rect x="312" y="122" width="276" height="46" rx="6" fill="#0d1117" stroke="#ffa657" stroke-width="1"/>
  <text x="326" y="142" fill="#ffa657" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">MCP001-008 · Static Config</text>
  <text x="326" y="159" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">Unpinned npx/uvx, secrets, HTTP, ~/.ssh mounts</text>

  <rect x="312" y="180" width="276" height="46" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1"/>
  <text x="326" y="200" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">TOOL001-008 · Poisoning &amp; Stego</text>
  <text x="326" y="217" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">Hidden directives, Unicode Tag decoder, shadowing</text>

  <rect x="312" y="238" width="276" height="46" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="1"/>
  <text x="326" y="258" fill="#d2a8ff" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">RUG001-004 · Rug-Pull Drift</text>
  <text x="326" y="275" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">SHA-256 schema pin &amp; silent mutation detection</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="606" y1="190" x2="645" y2="190" stroke="#3fb950" stroke-width="2"/>
  <polygon points="645,185 655,190 645,195" fill="#3fb950"/>

  <!-- Column 3: Outputs -->
  <rect x="657" y="82" width="215" height="218" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="764" y="106" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">3. Actionable Outputs</text>

  <rect x="673" y="122" width="183" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="764" y="142" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">Auto-Hardener (fix)</text>
  <text x="764" y="159" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">Dry-run &amp; --write remediation</text>

  <rect x="673" y="180" width="183" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="764" y="200" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">SARIF 2.1.0 &amp; CI Gate</text>
  <text x="764" y="217" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">GitHub Code Scanning + --fail-on</text>

  <rect x="673" y="238" width="183" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="764" y="258" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">Grade A-F &amp; JSON</text>
  <text x="764" y="275" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10.5">0-100 risk score + rule metadata</text>
</svg>
